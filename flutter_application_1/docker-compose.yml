version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mostaql_postgres
    environment:
      POSTGRES_USER: mostaql
      POSTGRES_PASSWORD: mostaql_dev_pass
      POSTGRES_DB: mostaql_shipping
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: mostaql_redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: mostaql_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mostaql_api
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: mostaql
      DB_PASSWORD: mostaql_dev_pass
      DB_NAME: mostaql_shipping
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  routing-engine:
    build:
      context: ./apps/routing-engine
      dockerfile: Dockerfile
    container_name: mostaql_routing
    ports: ["8000:8000"]
    environment:
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  pgdata:
